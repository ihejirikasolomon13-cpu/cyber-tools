
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075E54">
<title>SoloChat PRIVATE</title>
<link rel="manifest" href='data:application/json,{"name": "SoloChat PRIVATE", "short_name": "SoloChat", "start_url": "/", "display": "standalone", "background_color": "#111b21", "theme_color": "#075E54", "icons": [{"src": "data:image/svg+xml,<svg xmlns= http://www.w3.org/2000/svg  viewBox= 0 0 512 512 ><rect width= 512  height= 512  rx= 120  fill= %2300a884 /><text x= 50%  y= 55%  dominant-baseline= middle  text-anchor= middle  font-size= 280  fill= white >S</text></svg>", "sizes": "512x512", "type": "image/svg+xml", "purpose": "any maskable"}]}'>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#111b21;color:#e9edef;height:100vh;display:flex;flex-direction:column}
.header{background:#202c33;padding:15px}
.header h1{color:#00a884;font-size:20px}
.container{flex:1;display:flex;overflow:hidden}
.sidebar{width:35%;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
@media(max-width:700px){.sidebar{width:100%}.chat-area{position:fixed;top:0;left:100%;width:100%;height:100%;z-index:10;transition:.3s}.chat-area.active{left:0}}
.add-box{padding:12px;background:#202c33;display:flex;gap:8px}
.add-box input{flex:1;padding:10px 14px;border-radius:8px;border:none;background:#2a3942;color:#fff;outline:none}
.add-box button{padding:10px 16px;background:#00a884;border:none;border-radius:8px;color:#fff;font-weight:bold}
.contacts{flex:1;overflow-y:auto}
.contact{padding:12px 15px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #202c33;cursor:pointer}
.avatar{width:45px;height:45px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}
.chat-area{flex:1;display:flex;flex-direction:column;background:#0b141a}
.chat-header{background:#202c33;padding:12px 15px;display:flex;align-items:center;gap:12px}
.chat-header button{background:none;border:none;color:#fff;font-size:22px;display:none}
@media(max-width:700px){.chat-header button{display:block}}
.messages{flex:1;overflow-y:auto;padding:15px}
.msg{max-width:70%;padding:8px 12px;border-radius:8px;margin-bottom:8px}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
.input-area{padding:10px;background:#202c33;display:flex;gap:8px}
.input-area input{flex:1;padding:12px 16px;border-radius:21px;border:none;background:#2a3942;color:#fff;outline:none}
.input-area button{width:45px;height:45px;background:#00a884;border:none;border-radius:50%;color:#fff;font-size:20px}
</style>
</head>
<body>
<div class="header"><h1>SoloChat PRIVATE 🔒</h1></div>
<div class="container">
<div class="sidebar">
<div class="add-box"><input id="phoneInput" type="tel" placeholder="Add phone 080..."><button onclick="addContact()">Add</button></div>
<div class="contacts" id="contacts"></div>
</div>
<div class="chat-area" id="chatArea">
<div class="chat-header"><button onclick="closeChat()">←</button><div class="avatar" id="chatAvatar">?</div><div><div id="chatName" style="font-weight:bold">Select chat</div><div id="chatPhone" style="font-size:12px;color:#8696a0"></div></div></div>
<div class="messages" id="messages"></div>
<div class="input-area"><input id="msgInput" placeholder="Type message" onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div>
</div>
</div>
<script>
let contacts=JSON.parse(localStorage.getItem('solo_contacts')||'[]');
let chats=JSON.parse(localStorage.getItem('solo_chats')||'{}');
let current=null;
function renderContacts(){
const el=document.getElementById('contacts');
if(contacts.length===0){el.innerHTML='<div style="padding:20px;text-align:center;color:#8696a0">No chats<br>Add number</div>';return}
el.innerHTML=contacts.map(c=>`<div class="contact" onclick="openChat('${c.phone}')"><div class="avatar">${c.name[0].toUpperCase()}</div><div><div>${c.name}</div><div style="font-size:12px;color:#8696a0">${(chats[c.phone]||[]).slice(-1)[0]?.text||c.phone}</div></div></div>`).join('');
}
function addContact(){
const phone=document.getElementById('phoneInput').value.trim();
if(!phone){alert('Enter phone');return}
const name=prompt('Name?',phone)||phone;
contacts.unshift({phone,name});localStorage.setItem('solo_contacts',JSON.stringify(contacts));
document.getElementById('phoneInput').value='';renderContacts();openChat(phone);
}
function openChat(phone){
current=phone;const c=contacts.find(x=>x.phone===phone);
document.getElementById('chatName').textContent=c.name;document.getElementById('chatPhone').textContent=c.phone;
document.getElementById('chatAvatar').textContent=c.name[0].toUpperCase();
document.getElementById('chatArea').classList.add('active');renderMessages();
}
function closeChat(){document.getElementById('chatArea').classList.remove('active');current=null}
function renderMessages(){
const el=document.getElementById('messages');if(!current)return;
const list=chats[current]||[];
if(list.length===0){el.innerHTML='<div style="text-align:center;color:#8696a0;margin-top:30%">Private with '+current+'</div>';return}
el.innerHTML=list.map(m=>`<div class="msg ${m.me?'me':'other'}">${m.text}<div style="font-size:10px;color:#8696a0;text-align:right">${m.time}</div></div>`).join('');
el.scrollTop=el.scrollHeight;
}
function sendMsg(){
if(!current){alert('Select contact');return}
const input=document.getElementById('msgInput');const text=input.value.trim();if(!text)return;
if(!chats[current])chats[current]=[];chats[current].push({text,me:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
localStorage.setItem('solo_chats',JSON.stringify(chats));input.value='';renderMessages();renderContacts();
}
renderContacts();
</script>
</body>
</html>
